<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Eduessay — Ujian Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#673ab7">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--bg:#f0ebf8;--card:#fff;--tx:#202124;--mut:#5f6368;--pri:#673ab7;--bd:#dadce0;--ok:#188038;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a29;--card:#2b2838;--tx:#e8eaed;--mut:#9aa0a6;--pri:#b39ddb;--bd:#4a4658;--ok:#81c995;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;margin-bottom:14px}.top{border-top:8px solid var(--pri)}
h1{font-size:25px;margin:0 0 6px;font-weight:650}h2{font-size:18px;margin:0 0 8px;font-weight:600}.mut{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:5px 0;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}textarea{resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px}.bar .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tag{font-size:12px;background:var(--bg);border-radius:20px;padding:3px 10px;color:var(--mut)}.err{color:var(--bad);font-size:13px;margin-top:8px}.ok{color:var(--ok)}.tm{font-weight:700;color:var(--pri)}
.canvas-wrap{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff;margin-top:8px}.draw-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--bg);border-bottom:1px solid var(--bd)}.draw-tools .btn{padding:6px 10px;font-size:13px}.draw-tools .active{outline:2px solid var(--pri);outline-offset:1px}
.answer-canvas{display:block;width:100%;height:auto;aspect-ratio:5/2;touch-action:none;cursor:crosshair;background:#fff}.hint{font-size:12px;color:var(--mut);margin-top:6px}.question{scroll-margin-top:70px}
@media(max-width:520px){.school-header{width:calc(100% - 20px);margin:12px auto}.w{padding:10px}.card{padding:15px}.bar{padding:10px}.answer-canvas{aspect-ratio:4/3}}
.school-header{width:calc(100% - 32px);max-width:960px;margin:30px auto 18px;background:var(--card);text-align:center;border:1px solid var(--bd);border-radius:14px;overflow:hidden}.school-header img{display:block;width:100%;height:auto;margin:0 auto}
</style>
</head>
<body>
<div class="school-header"><img src="https://raw.githubusercontent.com/Arifulamar/eduessay/main/header-ujian.png" alt="Kop surat SMA Negeri 1 Sabang"></div>
<div class="bar"><div class="in"><strong style="font-size:18px">📝 Eduessay</strong><span class="sp"></span><span class="tag">Mode Siswa</span></div></div>
<div class="w" id="app"><div class="card">Memuat ujian…</div></div>
<script>
const S={db:null,auth:null,uid:null,forms:[],view:'home',id:null,ans:{},nm:'',em:'',tick:null,started:false,strokes:{},tools:{}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const F=id=>S.forms.find(f=>f.id===id);
function go(h){location.hash=h;route()}
function route(){clearInterval(S.tick);const h=location.hash.slice(1);if(h.startsWith('f-')){S.view='take';S.id=h.slice(2)}else{S.view='home';S.id=null;S.started=false}render()}
window.addEventListener('hashchange',route);
function init(){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);S.auth=firebase.auth();S.db=firebase.firestore();
  S.auth.onAuthStateChanged(async user=>{
   if(!user){try{await S.auth.signInAnonymously()}catch(e){app.innerHTML='<div class="card top"><h1>Tidak dapat terhubung</h1><p>'+esc(e.message)+'</p><p class="mut">Pastikan Anonymous Authentication aktif di Firebase.</p></div>'}return}
   S.uid=user.uid;loadForms();
  });
 }catch(e){app.innerHTML='<div class="card top">Gagal memuat aplikasi: '+esc(e.message||e)+'</div>'}
}
function loadForms(){
 S.db.collection('forms').where('open','==',true).onSnapshot(s=>{S.forms=s.docs.map(d=>({id:d.id,...d.data()}));if(!S.started)render()},e=>{app.innerHTML='<div class="card top"><h2>Gagal memuat ujian</h2><p>'+esc(e.message)+'</p></div>'});
}
function render(){if(S.view==='take')renderTake();else renderHome()}
function renderHome(){
 const forms=S.forms.filter(f=>f.open).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let h='<div class="card top"><h1>Ujian Esai Online</h1><p class="mut">Pilih ujian yang tersedia, isi identitas, lalu jawab dengan mengetik atau menulis langsung pada kanvas.</p></div>';
 if(!forms.length)h+='<div class="card"><h2>Belum ada ujian yang dibuka</h2><p class="mut">Silakan periksa kembali nanti atau hubungi guru/pengawas.</p></div>';
 forms.forEach(f=>{const done=ls.get('done_'+f.id);h+='<div class="card"><h2>'+esc(f.title||'Ujian tanpa judul')+'</h2><p class="mut">'+(f.questions||[]).length+' soal · '+(f.duration?f.duration+' menit':'tanpa batas waktu')+'</p>'+(f.desc?'<p>'+esc(f.desc)+'</p>':'')+'<div class="row">'+(done?'<span class="ok">✓ Sudah dikirim dari perangkat ini</span>':'<button class="btn" onclick="go(\'f-'+f.id+'\')">Mulai ujian</button>')+'</div></div>'});
 app.innerHTML=h;
}
function draftKey(){return 'draft_'+S.id}
function readDraft(){let d={};try{d=JSON.parse(ls.get(draftKey())||'{}')}catch(e){}S.ans=d.a||{};S.nm=d.n||'';S.em=d.e||''}
function saveDraft(){ls.set(draftKey(),JSON.stringify({a:S.ans,n:S.nm,e:S.em}))}
function answerEmpty(q){
 const a=S.ans[q.id];if(a===undefined||a===null||a==='')return true;
 if(q.type==='para'&&typeof a==='object')return !(String(a.text||'').trim()||a.drawing);
 if(Array.isArray(a))return !a.length;return false;
}
function renderTake(){
 const f=F(S.id);if(!f){app.innerHTML='<div class="card"><h2>Ujian tidak ditemukan</h2><button class="btn g" onclick="go(\'\')">Kembali</button></div>';return}
 if(!f.open){app.innerHTML='<div class="card top"><h2>Ujian ditutup</h2><button class="btn g" onclick="go(\'\')">Kembali</button></div>';return}
 if(ls.get('done_'+f.id)){app.innerHTML='<div class="card top"><h1>'+esc(f.title)+'</h1><p class="ok">✓ Jawaban dari perangkat ini sudah dikirim.</p><button class="btn g" onclick="go(\'\')">Kembali ke beranda</button></div>';return}
 readDraft();S.started=true;
 let h='<div class="card top"><div class="row"><button class="btn g" onclick="go(\'\')">← Kembali</button><span class="sp"></span>'+(f.duration?'<span class="tag">Sisa waktu: <b class="tm" id="tm">--:--</b></span>':'')+'</div><h1 style="margin-top:12px">'+esc(f.title)+'</h1><p>'+esc(f.desc||'Kerjakan semua soal dengan teliti.')+'</p><p class="mut">* Wajib diisi. Untuk soal esai, Anda dapat mengetik, menulis tangan, atau menggunakan keduanya.</p></div>';
 h+='<div class="card"><h2>Identitas Siswa *</h2><input id="nm" placeholder="Nama lengkap" value="'+esc(S.nm)+'" oninput="identityChanged()"><input id="em" placeholder="NIS / Email" value="'+esc(S.em)+'" oninput="identityChanged()"></div>';
 (f.questions||[]).forEach((q,i)=>{const a=S.ans[q.id];h+='<div class="card question" id="q'+i+'"><h2>'+(i+1)+'. '+esc(q.text)+(q.required?' <span style="color:var(--bad)">*</span>':'')+'</h2><div class="mut">'+q.points+' poin</div>';
  if(q.type==='para'){
   const val=typeof a==='object'&&a?a.text||'':typeof a==='string'?a:'';
   h+='<label class="mut">Jawaban dengan ketikan</label><textarea rows="5" placeholder="Ketik jawaban di sini (boleh dikosongkan jika menulis tangan)..." oninput="setEssayText(\''+q.id+'\',this.value)">'+esc(val)+'</textarea>';
   h+='<label class="mut">Jawaban dengan tulisan tangan</label><div class="canvas-wrap"><div class="draw-tools"><button class="btn g active" id="pen-'+q.id+'" onclick="setTool(\''+q.id+'\',\'pen\')">✎ Pena</button><button class="btn g" id="erase-'+q.id+'" onclick="setTool(\''+q.id+'\',\'erase\')">Penghapus</button><button class="btn g" onclick="undoStroke(\''+q.id+'\')">↶ Undo</button><button class="btn r" onclick="clearCanvas(\''+q.id+'\')">Hapus semua</button><label class="mut" style="display:flex;align-items:center;gap:5px">Ukuran <select style="width:auto;margin:0;padding:4px" onchange="setPenSize(\''+q.id+'\',this.value)"><option value="3">Tipis</option><option value="5" selected>Normal</option><option value="9">Tebal</option></select></label></div><canvas class="answer-canvas" id="cv-'+q.id+'" width="1000" height="400" aria-label="Kanvas tulisan tangan"></canvas></div><p class="hint">Gunakan jari, stylus, atau mouse. Goresan tersimpan otomatis di perangkat ini.</p>';
  }else if(q.type==='short')h+='<input value="'+esc(a||'')+'" placeholder="Jawaban singkat" oninput="setAnswer(\''+q.id+'\',this.value)">';
  else if(q.type==='drop')h+='<select onchange="setAnswer(\''+q.id+'\',this.value===\'\'?undefined:+this.value)"><option value="">Pilih jawaban…</option>'+(q.options||[]).map((o,j)=>'<option value="'+j+'"'+(a===j?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  else (q.options||[]).forEach((o,j)=>{const c=q.type==='check'?(a||[]).includes(j):a===j;h+='<label style="display:block;padding:7px 0"><input style="width:auto" type="'+(q.type==='check'?'checkbox':'radio')+'" name="r'+i+'" '+(c?'checked':'')+' onchange="choiceAnswer(\''+q.id+'\','+j+',this.checked,\''+q.type+'\')"> '+esc(o)+'</label>'});
  h+='</div>';
 });
 h+='<div class="card"><button class="btn" id="sb" onclick="submitExam(false)">Kirim Jawaban</button><div id="se" class="err"></div><p class="hint">Pastikan semua jawaban sudah benar sebelum dikirim.</p></div>';app.innerHTML=h;
 (f.questions||[]).filter(q=>q.type==='para').forEach(q=>initCanvas(q.id,S.ans[q.id]?.drawing));
 if(f.duration){const k='st_'+f.id;let st=+ls.get(k)||0;if(!st){st=Date.now();ls.set(k,st)}const end=st+f.duration*60000;const tick=()=>{const r=Math.max(0,end-Date.now()),el=$('#tm');if(el)el.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r%60000/1000)).padStart(2,'0');if(r<=0){clearInterval(S.tick);submitExam(true)}};tick();S.tick=setInterval(tick,1000)}
}
function identityChanged(){S.nm=$('#nm').value;S.em=$('#em').value;saveDraft()}
function setAnswer(id,v){S.ans[id]=v;saveDraft()}
function setEssayText(id,v){const a=S.ans[id]&&typeof S.ans[id]==='object'?S.ans[id]:{text:typeof S.ans[id]==='string'?S.ans[id]:''};a.text=v;S.ans[id]=a;saveDraft()}
function choiceAnswer(id,j,on,type){if(type==='check'){const a=new Set(S.ans[id]||[]);on?a.add(j):a.delete(j);S.ans[id]=[...a].sort((x,y)=>x-y)}else S.ans[id]=j;saveDraft()}
function initCanvas(id,data){
 const c=$('#cv-'+id);if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.lineCap='round';ctx.lineJoin='round';S.strokes[id]=[];
 if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=data}
 const point=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 let drawing=false;
 c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;S.strokes[id].push(ctx.getImageData(0,0,c.width,c.height));const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=(S.tools[id]==='erase'?'#fff':'#202124');ctx.lineWidth=S.tools[id]==='erase'?28:(S.tools[id]?.size||5)*2;ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
 c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.strokeStyle=(S.tools[id]==='erase'?'#fff':'#202124');ctx.lineWidth=S.tools[id]==='erase'?28:(S.tools[id]?.size||5)*2;ctx.lineTo(p.x,p.y);ctx.stroke()});
 const end=()=>{if(!drawing)return;drawing=false;ctx.closePath();persistCanvas(id,c)};
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('pointerleave',e=>{if(e.buttons===0)end()});
}
function persistCanvas(id,c){const a=S.ans[id]&&typeof S.ans[id]==='object'?S.ans[id]:{text:typeof S.ans[id]==='string'?S.ans[id]:''};a.drawing=c.toDataURL('image/jpeg',.68);S.ans[id]=a;saveDraft()}
function setTool(id,tool){S.tools[id]=S.tools[id]||{size:5};S.tools[id].mode=tool;S.tools[id]=tool;$('#pen-'+id)?.classList.toggle('active',tool==='pen');$('#erase-'+id)?.classList.toggle('active',tool==='erase')}
function setPenSize(id,v){S.tools[id]={mode:'pen',size:+v||5}}
function undoStroke(id){const c=$('#cv-'+id),ctx=c?.getContext('2d'),stack=S.strokes[id];if(!c||!stack?.length)return;ctx.putImageData(stack.pop(),0,0);persistCanvas(id,c)}
function clearCanvas(id){const c=$('#cv-'+id);if(!c)return;if(!confirm('Hapus seluruh tulisan tangan pada soal ini?'))return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);S.strokes[id]=[];persistCanvas(id,c)}
const empty=v=>v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
async function submitExam(auto){
 const f=F(S.id);S.nm=$('#nm')?.value.trim()||'';S.em=$('#em')?.value.trim()||'';
 if(!auto){if(!S.nm||!S.em){$('#se').textContent='Isi nama lengkap dan NIS/email.';return}const bad=(f.questions||[]).findIndex(q=>q.required&&answerEmpty(q));if(bad>=0){$('#se').textContent='Soal nomor '+(bad+1)+' wajib dijawab.';$('#q'+bad).scrollIntoView({behavior:'smooth',block:'center'});return}if(!confirm('Kirim semua jawaban sekarang? Jawaban tidak dapat diubah setelah dikirim.'))return}
 const b=$('#sb');if(b)b.disabled=true;
 try{
  const answers={};(f.questions||[]).forEach(q=>{if(!answerEmpty(q))answers[q.id]=S.ans[q.id]});
  const rec={name:S.nm||'(tanpa nama)',email:S.em,answers,submittedAt:Date.now(),auto:!!auto};
  await S.db.collection('responses').doc(S.uid+'_'+f.id).set({formId:f.id,studentUid:S.uid,name:rec.name,email:rec.email,answers:rec.answers,submittedAt:rec.submittedAt,auto:rec.auto},{merge:false});
  ls.set('done_'+f.id,'1');ls.del(draftKey());ls.del('st_'+f.id);clearInterval(S.tick);S.started=false;
  app.innerHTML='<div class="card top"><h1>'+esc(f.title)+'</h1><p class="ok">✓ Jawaban berhasil dikirim'+(auto?' karena waktu ujian habis':'')+'. Terima kasih.</p><button class="btn" onclick="go(\'\')">Kembali ke beranda</button></div>';
 }catch(e){if(b)b.disabled=false;$('#se').textContent='Gagal mengirim jawaban: '+(e.message||e)+'. Periksa koneksi internet dan izin Firestore.'}
}
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
