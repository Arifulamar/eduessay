<html lang="id">
<head>

<link rel="icon" href="icon.svg">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--bg:#f0ebf8;--card:#fff;--tx:#202124;--mut:#5f6368;--pri:#673ab7;--bd:#dadce0;--ok:#188038;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a29;--card:#2b2838;--tx:#e8eaed;--mut:#9aa0a6;--pri:#b39ddb;--bd:#4a4658;--ok:#81c995;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;margin-bottom:14px}.top{border-top:8px solid var(--pri)}
h1{font-size:25px;margin:0 0 6px;font-weight:650}h2{font-size:18px;margin:0 0 8px;font-weight:600}.mut{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:5px 0;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}textarea{resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px}.bar .in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tag{font-size:12px;background:var(--bg);border-radius:20px;padding:3px 10px;color:var(--mut)}.err{color:var(--bad);font-size:13px;margin-top:8px}.ok{color:var(--ok)}.tm{font-weight:700;color:var(--pri)}
.canvas-wrap{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff;margin-top:8px}.draw-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--bg);border-bottom:1px solid var(--bd)}.draw-tools .btn{padding:6px 10px;font-size:13px}.draw-tools .active{outline:2px solid var(--pri);outline-offset:1px}
.answer-canvas{display:block;width:100%;height:auto;aspect-ratio:5/2;touch-action:none;cursor:crosshair;background:#fff}.hint{font-size:12px;color:var(--mut);margin-top:6px}.question{scroll-margin-top:70px}
@media(max-width:520px){.school-header{width:calc(100% - 20px);margin:12px auto}.w{padding:10px}.card{padding:15px}.bar{padding:10px}.answer-canvas{aspect-ratio:4/3}}
.school-header{width:calc(100% - 32px);max-width:960px;margin:30px auto 18px;background:var(--card);text-align:center;border:1px solid var(--bd);border-radius:14px;overflow:hidden}.school-header img{display:block;width:100%;height:auto;margin:0 auto}

/* Homepage Educonnect */
.home-hero{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:center;overflow:hidden;padding:clamp(24px,5vw,54px);margin:18px 0 16px;border-radius:24px;background:linear-gradient(135deg,#211344 0%,#4d2b91 58%,#7045bd 100%);color:#fff;box-shadow:0 18px 45px rgba(54,31,105,.16)}
.hero-copy{position:relative;z-index:1}.eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.7px;color:#d8c8ff}.hero-copy h1{max-width:650px;margin:14px 0;font-size:clamp(30px,4.2vw,48px);line-height:1.12;letter-spacing:-1.2px}.hero-copy>p{max-width:590px;color:#e6def6;font-size:16px;line-height:1.7}.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.home-actions a{text-decoration:none;display:inline-flex;align-items:center;gap:10px;font-weight:650}.home-primary{background:#fff;color:#45218b}.home-secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}.home-note{margin-top:16px;color:#d7cbed;font-size:12px;max-width:520px}.hero-art{height:245px;position:relative;display:flex;align-items:center;justify-content:center}.art-orbit{position:absolute;border:1px solid rgba(255,255,255,.25);border-radius:50%;width:230px;height:230px}.orbit-two{width:180px;height:180px;border-style:dashed}.art-paper{position:relative;width:142px;height:184px;border-radius:13px;background:#fff;color:#45218b;padding:20px;transform:rotate(7deg);box-shadow:0 18px 35px rgba(0,0,0,.25)}.paper-mark{font-size:26px;font-weight:900;margin-bottom:22px}.paper-line{height:7px;background:#e6e0f1;border-radius:8px;margin:12px 0;width:75%}.paper-line.long{width:100%}.paper-line.short{width:55%}.paper-check{position:absolute;right:-18px;bottom:15px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#25b77a;color:#fff;font-size:25px;font-weight:800;border:4px solid #fff}.art-badge{position:absolute;bottom:12px;right:4%;padding:9px 14px;border-radius:30px;background:#fff;color:#45218b;font-size:12px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.15)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 34px}.feature-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}.feature-icon{font-size:25px;margin-bottom:8px}.feature-card h2{font-size:16px;margin:0 0 6px}.feature-card p{font-size:13px;color:var(--mut);margin:0;line-height:1.6}.exam-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 14px}.exam-heading h2{font-size:23px;margin:4px 0}.exam-count{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--bd);padding:7px 11px;border-radius:20px;white-space:nowrap}.exam-card{display:flex;gap:15px;align-items:flex-start}.exam-symbol{width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px}.exam-info{flex:1;min-width:0}.exam-info h2{margin:0 0 5px}.exam-info>p{margin:5px 0 10px}.empty-exams{text-align:center;padding:30px}.home-footer{text-align:center;color:var(--mut);font-size:12px;padding:28px 10px 12px}
@media(max-width:680px){.home-hero{grid-template-columns:1fr;padding:25px 22px;border-radius:18px}.hero-art{height:165px}.art-orbit{width:160px;height:160px}.orbit-two{width:125px;height:125px}.art-paper{transform:scale(.78) rotate(7deg)}.art-badge{right:8%;bottom:0}.feature-grid{grid-template-columns:1fr;gap:9px;margin-bottom:26px}.feature-card{display:grid;grid-template-columns:42px 1fr;column-gap:10px;padding:14px}.feature-icon{grid-row:span 2;margin:0}.feature-card h2{align-self:end}.exam-heading{align-items:start;flex-direction:column}.exam-card{gap:10px}.home-actions a{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="school-header"><img src="https://raw.githubusercontent.com/Arifulamar/eduessay/main/header-ujian.png" alt="Kop surat SMA Negeri 1 Sabang"></div>
<div class="bar"><div class="in"><strong style="font-size:18px">📝 Eduessay</strong><span class="sp"></span><span class="tag">Mode Siswa</span></div></div>
<div class="w" id="app"><div class="card">Memuat ujian…</div></div>
<script>
const S={db:null,auth:null,uid:null,forms:[],view:'home',id:null,ans:{},nm:'',kelas:'',tick:null,started:false,strokes:{},tools:{}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const F=id=>S.forms.find(f=>f.id===id);
function go(h){location.hash=h;route()}
function route(){clearInterval(S.tick);const h=location.hash.slice(1);if(h.startsWith('f-')){S.view='take';S.id=h.slice(2)}else{S.view='home';S.id=null;S.started=false}render()}
window.addEventListener('hashchange',route);
function init(){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);S.auth=firebase.auth();S.db=firebase.firestore();
  S.auth.onAuthStateChanged(async user=>{
   if(!user){try{await S.auth.signInAnonymously()}catch(e){app.innerHTML='<div class="card top"><h1>Tidak dapat terhubung</h1><p>'+esc(e.message)+'</p><p class="mut">Pastikan Anonymous Authentication aktif di Firebase.</p></div>'}return}
   S.uid=user.uid;loadForms();
  });
 }catch(e){app.innerHTML='<div class="card top">Gagal memuat aplikasi: '+esc(e.message||e)+'</div>'}
}
function loadForms(){
 S.db.collection('forms').where('open','==',true).onSnapshot(s=>{S.forms=s.docs.map(d=>({id:d.id,...d.data()}));route()},e=>{app.innerHTML='<div class="card top"><h2>Gagal memuat ujian</h2><p>'+esc(e.message)+'</p></div>'});
}
function render(){if(S.view==='take')renderTake();else renderHome()}
function renderHome(){
 const forms=S.forms.filter(f=>f.open).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 let h='<section class="home-hero"><div class="hero-copy"><span class="eyebrow">PLATFORM PEMBELAJARAN DIGITAL</span><h1>Belajar, mengajar, dan menguji kemampuan dalam satu tempat.</h1><p>Educonnect membantu guru mengelola ujian online dan memudahkan siswa mengerjakan soal secara praktis, tertib, dan fleksibel.</p><div class="home-actions"><a class="btn home-primary" href="guru/">Masuk Guru dengan Google <span aria-hidden="true">↗</span></a><a class="btn home-secondary" href="#daftar-ujian">Lihat Ujian Siswa</a></div><div class="home-note">Guru masuk menggunakan akun Google yang telah terdaftar. Akun guru baru menunggu persetujuan administrator.</div></div><div class="hero-art" aria-hidden="true"><div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div><div class="art-paper"><div class="paper-mark">E</div><div class="paper-line long"></div><div class="paper-line"></div><div class="paper-line short"></div><div class="paper-check">✓</div></div><div class="art-badge">✦ Educonnect</div></div></section>';
 h+='<section class="feature-grid"><article class="feature-card"><div class="feature-icon">✍️</div><h2>Ujian Online</h2><p>Kerjakan soal esai, pilihan ganda, dan jawaban singkat melalui perangkat Anda.</p></article><article class="feature-card"><div class="feature-icon">🎓</div><h2>Ruang Guru</h2><p>Guru dapat membuat ujian, mengatur soal, dan memantau tanggapan siswa.</p></article><article class="feature-card"><div class="feature-icon">📱</div><h2>Fleksibel</h2><p>Akses platform melalui komputer, tablet, maupun ponsel.</p></article></section>';
 h+='<section id="daftar-ujian" class="exam-heading"><div><span class="eyebrow">UNTUK SISWA</span><h2>Ujian yang tersedia</h2><p class="mut">Pilih ujian yang sedang dibuka oleh guru Anda.</p></div><span class="exam-count">'+forms.length+' ujian tersedia</span></section>';
 if(!forms.length)h+='<div class="card empty-exams"><h2>Belum ada ujian yang dibuka</h2><p class="mut">Silakan periksa kembali nanti atau hubungi guru/pengawas.</p></div>';
 forms.forEach(f=>{const done=ls.get('done_'+f.id);h+='<div class="card exam-card"><div class="exam-symbol">📝</div><div class="exam-info"><h2>'+esc(f.title||'Ujian tanpa judul')+'</h2><p class="mut">'+(f.questions||[]).length+' soal · '+(f.duration?f.duration+' menit':'tanpa batas waktu')+'</p>'+(f.desc?'<p>'+esc(f.desc)+'</p>':'')+'<div class="row">'+(done?'<span class="ok">✓ Sudah dikirim dari perangkat ini</span>':'<button class="btn" onclick="go(\'f-'+f.id+'\')">Mulai ujian</button>')+'</div></div></div>'});
 h+='<footer class="home-footer">© '+new Date().getFullYear()+' Educonnect · Mendukung pembelajaran digital</footer>';
 app.innerHTML=h;
}
function draftKey(){return 'draft_'+S.id}
function readDraft(){let d={};try{d=JSON.parse(ls.get(draftKey())||'{}')}catch(e){}S.ans=d.a||{};S.nm=d.n||'';S.kelas=d.k||''}
function saveDraft(){ls.set(draftKey(),JSON.stringify({a:S.ans,n:S.nm,k:S.kelas}))}
function answerEmpty(q){
 const a=S.ans[q.id];if(a===undefined||a===null||a==='')return true;
 if((q.type==='para'||q.type==='essay_hand')&&typeof a==='object')return !(String(a.text||'').trim()||a.drawing);
 if(Array.isArray(a))return !a.length;return false;
}
function renderTake(){
 const f=F(S.id);if(!f){app.innerHTML='<div class="card"><h2>Ujian tidak ditemukan</h2><button class="btn g" onclick="go(\'\')">Kembali</button></div>';return}
 if(!f.open){app.innerHTML='<div class="card top"><h2>Ujian ditutup</h2><button class="btn g" onclick="go(\'\')">Kembali</button></div>';return}
 if(ls.get('done_'+f.id)){app.innerHTML='<div class="card top"><h1>'+esc(f.title)+'</h1><p class="ok">✓ Jawaban dari perangkat ini sudah dikirim.</p><button class="btn g" onclick="go(\'\')">Kembali ke beranda</button></div>';return}
 readDraft();S.started=true;
 let h='<div class="card top"><div class="row"><button class="btn g" onclick="go(\'\')">← Kembali</button><span class="sp"></span>'+(f.duration?'<span class="tag">Sisa waktu: <b class="tm" id="tm">--:--</b></span>':'')+'</div><h1 style="margin-top:12px">'+esc(f.title)+'</h1><p>'+esc(f.desc||'Kerjakan semua soal dengan teliti.')+'</p><p class="mut">* Wajib diisi. Untuk soal esai, Anda dapat mengetik, menulis tangan, atau menggunakan keduanya.</p></div>';
 h+='<div class="card"><h2>Identitas Siswa *</h2><label for="nm">Nama Lengkap *</label><input id="nm" placeholder="Nama lengkap" value="'+esc(S.nm)+'" oninput="identityChanged()"><label for="kelas">Kelas *</label><input id="kelas" placeholder="Contoh: XII IPA 1" value="'+esc(S.kelas)+'" oninput="identityChanged()"></div>';
 (f.questions||[]).forEach((q,i)=>{const a=S.ans[q.id];h+='<div class="card question" id="q'+i+'"><h2>'+(i+1)+'. '+esc(q.text)+(q.required?' <span style="color:var(--bad)">*</span>':'')+'</h2>'+(q.image?'<img class="question-image" src="'+q.image+'" alt="Gambar soal '+(i+1)+'" style="display:block;max-width:100%;max-height:520px;object-fit:contain;margin:12px 0;border-radius:8px">':'')+'<div class="mut">'+q.points+' poin</div>';
  if(q.type==='para'||q.type==='essay_text'){
   const val=typeof a==='object'&&a?a.text||'':typeof a==='string'?a:'';
   h+='<label class="mut">Jawaban esai (teks)</label><textarea rows="5" placeholder="Ketik jawaban di sini..." oninput="setEssayText(\''+q.id+'\',this.value)">'+esc(val)+'</textarea>';
   }else if(q.type==='essay_hand'){h+='<label class="mut">Jawaban esai (tulisan tangan)</label><div class="canvas-wrap"><div class="draw-tools"><button class="btn g active" id="pen-'+q.id+'" onclick="setTool(\''+q.id+'\',\'pen\')">✎ Pena</button><button class="btn g" id="erase-'+q.id+'" onclick="setTool(\''+q.id+'\',\'erase\')">Penghapus</button><button class="btn g" onclick="undoStroke(\''+q.id+'\')">↶ Undo</button><button class="btn r" onclick="clearCanvas(\''+q.id+'\')">Hapus semua</button><label class="mut" style="display:flex;align-items:center;gap:5px">Ukuran <select style="width:auto;margin:0;padding:4px" onchange="setPenSize(\''+q.id+'\',this.value)"><option value="3">Tipis</option><option value="5" selected>Normal</option><option value="9">Tebal</option></select></label></div><canvas class="answer-canvas" id="cv-'+q.id+'" width="1000" height="400" aria-label="Kanvas tulisan tangan"></canvas></div><p class="hint">Gunakan jari, stylus, atau mouse. Goresan tersimpan otomatis di perangkat ini.</p>';
  }else if(q.type==='short')h+='<input value="'+esc(a||'')+'" placeholder="Jawaban singkat" oninput="setAnswer(\''+q.id+'\',this.value)">';
  else if(q.type==='drop')h+='<select onchange="setAnswer(\''+q.id+'\',this.value===\'\'?undefined:+this.value)"><option value="">Pilih jawaban…</option>'+(q.options||[]).map((o,j)=>'<option value="'+j+'"'+(a===j?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  else (q.options||[]).forEach((o,j)=>{const c=q.type==='check'?(a||[]).includes(j):a===j;h+='<label style="display:block;padding:7px 0"><input style="width:auto" type="'+(q.type==='check'?'checkbox':'radio')+'" name="r'+i+'" '+(c?'checked':'')+' onchange="choiceAnswer(\''+q.id+'\','+j+',this.checked,\''+q.type+'\')"> '+esc(o)+'</label>'});
  h+='</div>';
 });
 h+='<div class="card"><button class="btn" id="sb" onclick="submitExam(false)">Kirim Jawaban</button><div id="se" class="err"></div><p class="hint">Pastikan semua jawaban sudah benar sebelum dikirim.</p></div>';app.innerHTML=h;
 (f.questions||[]).filter(q=>q.type==='essay_hand'||q.type==='para').forEach(q=>initCanvas(q.id,S.ans[q.id]?.drawing));
 if(f.duration){const k='st_'+f.id;let st=+ls.get(k)||0;if(!st){st=Date.now();ls.set(k,st)}const end=st+f.duration*60000;const tick=()=>{const r=Math.max(0,end-Date.now()),el=$('#tm');if(el)el.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r%60000/1000)).padStart(2,'0');if(r<=0){clearInterval(S.tick);submitExam(true)}};tick();S.tick=setInterval(tick,1000)}
}
function identityChanged(){S.nm=$('#nm').value;S.kelas=$('#kelas').value;saveDraft()}
function setAnswer(id,v){S.ans[id]=v;saveDraft()}
function setEssayText(id,v){S.ans[id]=v;saveDraft()}
function choiceAnswer(id,j,on,type){if(type==='check'){const a=new Set(S.ans[id]||[]);on?a.add(j):a.delete(j);S.ans[id]=[...a].sort((x,y)=>x-y)}else S.ans[id]=j;saveDraft()}
function initCanvas(id,data){
 const c=$('#cv-'+id);if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.lineCap='round';ctx.lineJoin='round';S.strokes[id]=[];
 if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=data}
 const point=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 let drawing=false;
 c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;S.strokes[id].push(ctx.getImageData(0,0,c.width,c.height));const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=(S.tools[id]==='erase'?'#fff':'#202124');ctx.lineWidth=S.tools[id]==='erase'?28:(S.tools[id]?.size||5)*2;ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
 c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.strokeStyle=(S.tools[id]==='erase'?'#fff':'#202124');ctx.lineWidth=S.tools[id]==='erase'?28:(S.tools[id]?.size||5)*2;ctx.lineTo(p.x,p.y);ctx.stroke()});
 const end=()=>{if(!drawing)return;drawing=false;ctx.closePath();persistCanvas(id,c)};
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('pointerleave',e=>{if(e.buttons===0)end()});
}
function persistCanvas(id,c){S.ans[id]={drawing:c.toDataURL('image/jpeg',.68)};saveDraft()}
function setTool(id,tool){S.tools[id]=S.tools[id]||{size:5};S.tools[id].mode=tool;S.tools[id]=tool;$('#pen-'+id)?.classList.toggle('active',tool==='pen');$('#erase-'+id)?.classList.toggle('active',tool==='erase')}
function setPenSize(id,v){S.tools[id]={mode:'pen',size:+v||5}}
function undoStroke(id){const c=$('#cv-'+id),ctx=c?.getContext('2d'),stack=S.strokes[id];if(!c||!stack?.length)return;ctx.putImageData(stack.pop(),0,0);persistCanvas(id,c)}
function clearCanvas(id){const c=$('#cv-'+id);if(!c)return;if(!confirm('Hapus seluruh tulisan tangan pada soal ini?'))return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);S.strokes[id]=[];persistCanvas(id,c)}
const empty=v=>v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
async function submitExam(auto){
 const f=F(S.id);S.nm=$('#nm')?.value.trim()||'';S.kelas=$('#kelas')?.value.trim()||'';
 if(!auto){if(!S.nm||!S.kelas){$('#se').textContent='Isi nama lengkap dan kelas.';return}const bad=(f.questions||[]).findIndex(q=>q.required&&answerEmpty(q));if(bad>=0){$('#se').textContent='Soal nomor '+(bad+1)+' wajib dijawab.';$('#q'+bad).scrollIntoView({behavior:'smooth',block:'center'});return}if(!confirm('Kirim semua jawaban sekarang? Jawaban tidak dapat diubah setelah dikirim.'))return}
 const b=$('#sb');if(b)b.disabled=true;
 try{
  const answers={};(f.questions||[]).forEach(q=>{if(!answerEmpty(q))answers[q.id]=S.ans[q.id]});
  const rec={name:S.nm||'(tanpa nama)',className:S.kelas,answers,submittedAt:Date.now(),auto:!!auto};
  await S.db.collection('responses').doc(S.uid+'_'+f.id).set({formId:f.id,studentUid:S.uid,name:rec.name,className:rec.className,answers:rec.answers,submittedAt:rec.submittedAt,auto:rec.auto},{merge:false});
  ls.set('done_'+f.id,'1');ls.del(draftKey());ls.del('st_'+f.id);clearInterval(S.tick);S.started=false;
  app.innerHTML='<div class="card top"><h1>'+esc(f.title)+'</h1><p class="ok">✓ Jawaban berhasil dikirim'+(auto?' karena waktu ujian habis':'')+'. Terima kasih.</p><button class="btn" onclick="go(\'\')">Kembali ke beranda</button></div>';
 }catch(e){if(b)b.disabled=false;$('#se').textContent='Gagal mengirim jawaban: '+(e.message||e)+'. Periksa koneksi internet dan izin Firestore.'}
}
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
